<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liam Lessard - Portfolio</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page-shell">
    <header class="site-header">
      <nav class="topbar" aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="bio.html">Bio</a>
        <a href="projects.html">Projects</a>
        <a href="socials.html">Socials</a>
      </nav>
      <h1>Welcome</h1>
    </header>

    <main>
      <p class="intro-copy">Hello! This is where I display my development work for you to explore. There is also a bio section so you can learn more about me, as well as a socials page if you want to get in touch.</p>
      <div class="buttons">
        <button id="socials" type="button" data-page="socials.html">Socials</button>
        <button id="projects" type="button" data-page="projects.html">Projects</button>
        <button id="bio" type="button" data-page="bio.html">About Me</button>
        <div class="theme-picker-wrap">
          <button id="theme" type="button" aria-expanded="false">Change Theme</button>
          <div id="theme-menu" class="theme-menu hidden" role="menu" aria-label="Theme select">
            <button class="theme-option selected" type="button" data-theme="toffee" role="menuitem"><span class="theme-swatch toffee"></span>Toffee</button>
            <button class="theme-option" type="button" data-theme="green" role="menuitem"><span class="theme-swatch green"></span>Green</button>
            <button class="theme-option" type="button" data-theme="purple" role="menuitem"><span class="theme-swatch purple"></span>Purple</button>
            <button class="theme-option" type="button" data-theme="red" role="menuitem"><span class="theme-swatch red"></span>Red</button>
            <button class="theme-option" type="button" data-theme="blue" role="menuitem"><span class="theme-swatch blue"></span>Blue</button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
